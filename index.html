      <div style="font-size:11px;color:var(--text-faint);margin-bottom:12px;">${def.desc||''}</div>`;

    if(simRunning){
      html += `<div style="background:var(--accent-dim);color:var(--accent-strong);border-radius:3px;padding:8px 10px;font-size:11px;margin-bottom:12px;">
        Simulação em execução — configurações bloqueadas. Pare a simulação para editar.</div>`;
    }

    if(def.type==='motor-trifasico' && !simRunning){
      html += `<label class="field"><span class="lbl">Carga mecânica no eixo</span>
        <select id="mp-load">
          <option value="0" ${inst.props.loadPct===0?'selected':''}>Sem carga (0%)</option>
          <option value="30" ${inst.props.loadPct===30?'selected':''}>Carga leve (30%)</option>
          <option value="70" ${inst.props.loadPct===70?'selected':''}>Carga nominal (70%)</option>
          <option value="100" ${inst.props.loadPct===100?'selected':''}>Carga máxima (100%)</option>
          <option value="130" ${inst.props.loadPct===130?'selected':''}>Sobrecarga (130%)</option>
        </select></label>`;
      html += renderMotorSpecFields();
    }
    if(def.type==='motor-trifasico' && simRunning){
      html += `<div style="font-size:12px;color:var(--text-dim);line-height:1.7;font-family:var(--mono);">
        Carga: ${inst.props.loadPct}%<br>
        Girando: ${(window.__MOTOR_RPM__&&Math.abs(window.__MOTOR_RPM__)>2)?'sim':'não'}</div>`;
      html += `<div style="border-top:1px solid var(--line-soft);margin-top:12px;padding-top:12px;">
        <div style="font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.03em;margin-bottom:8px;">PLAQUETA DO MOTOR (grupo P4)</div>`
        + MOTOR_SPEC_FIELDS.map(f=>{ const p=PARAMS[f.code]; return `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line-soft);"><span style="color:var(--text-dim);">${f.lbl}</span><span style="font-family:var(--mono);color:var(--text);">${p.val}${f.unit?' '+f.unit:''}</span></div>`; }).join('') + `</div>`;
    }
    if(def.type==='inversor-ad600m'){
      html += `<button class="btn primary" id="open-inv-panel" style="width:100%;margin-bottom:10px;">Abrir painel do inversor (RUN/STOP/parâmetros)</button>`;
      if(!simRunning) html += renderInverterQuickParams();
    }
    if(inst.props.tag!==undefined && !simRunning){
      html += `<label class="field"><span class="lbl">Identificação (TAG, ex.: K1)</span><input type="text" id="inst-tag" value="${inst.props.tag}"></label>`;
    }
    if(def.type==='potenciometro'){
      html += `<label class="field"><span class="lbl">Posição (0–10V): <span id="pot-val-lbl">${(inst.props.value||0).toFixed(1)}</span>V</span>
        <input type="range" id="pot-val" min="0" max="10" step="0.1" value="${inst.props.value||0}" ${simRunning?'':'disabled'}></label>
        ${simRunning? '<div style="font-size:10.5px;color:var(--text-faint);">Arraste para alterar a tensão enviada à entrada AI1.</div>' : '<div style="font-size:10.5px;color:var(--text-faint);">Inicie a simulação para girar o potenciômetro.</div>'}`;
    }
    if(def.type==='lampada-piloto' && !simRunning){
      html += `<label class="field"><span class="lbl">Cor</span>
        <select id="lamp-color">
          <option value="#e5484d" ${inst.props.color==='#e5484d'?'selected':''}>Vermelho</option>
          <option value="#3ecf6e" ${inst.props.color==='#3ecf6e'?'selected':''}>Verde</option>
          <option value="#f0a020" ${inst.props.color==='#f0a020'?'selected':''}>Âmbar</option>
          <option value="#4d9fe5" ${inst.props.color==='#4d9fe5'?'selected':''}>Azul</option>
        </select></label>`;
    }
    if(!simRunning && !def.junction){
      html += `<label class="field"><span class="lbl">Rotação</span>
        <div style="display:flex;gap:6px;">
          <button class="btn" id="rot-l" style="flex:1;">↺ 90°</button>
          <button class="btn" id="rot-r" style="flex:1;">↻ 90°</button>
        </div></label>`;
    }
    html += `<div style="font-size:10.5px;color:var(--text-faint);font-family:var(--mono);margin:10px 0;">Terminais: ${def.terms.map(t=>t.id).join(' · ')}</div>`;
    if(!simRunning){
      html += `<button class="btn danger" id="del-inst" style="width:100%;margin-top:6px;background:var(--red-dim);border-color:var(--red);color:#ffe0e1;">Excluir (Del)</button>`;
    }
    html += `</div>`;
    el.innerHTML = html;

    const openInvBtn = document.getElementById('open-inv-panel');
    if(openInvBtn) openInvBtn.addEventListener('click', ()=> openInverterPanel(inst));
    const mpLoad = document.getElementById('mp-load');
    if(mpLoad) mpLoad.addEventListener('change', e=>{ inst.props.loadPct=Number(e.target.value); onChangeCb(); });
    wireMotorSpecFields(inst);
    wireInverterQuickParams(inst);
    const potVal = document.getElementById('pot-val');
    if(potVal) potVal.addEventListener('input', e=>{
      inst.props.value=Number(e.target.value);
      document.getElementById('pot-val-lbl').textContent = inst.props.value.toFixed(1);
      renderComp(inst); onChangeCb();
    });
    const lampColor = document.getElementById('lamp-color');
    if(lampColor) lampColor.addEventListener('change', e=>{ inst.props.color=e.target.value; renderComp(inst); onChangeCb(); });
    const rotL = document.getElementById('rot-l');
    if(rotL) rotL.addEventListener('click', ()=>{ inst.rot=((inst.rot||0)-90+360)%360; renderComp(inst); renderWiresFor(inst.id); onChangeCb(); });
    const rotR = document.getElementById('rot-r');
    if(rotR) rotR.addEventListener('click', ()=>{ inst.rot=((inst.rot||0)+90)%360; renderComp(inst); renderWiresFor(inst.id); onChangeCb(); });
    const tagIn = document.getElementById('inst-tag');
    if(tagIn) tagIn.addEventListener('change', e=>{ inst.props.tag=e.target.value.trim(); instances.forEach(renderComp); onChangeCb(); });
    const delBtn = document.getElementById('del-inst');
    if(delBtn) delBtn.addEventListener('click', deleteSelected);
  }

  function restoreSnap(s){
    const d=JSON.parse(s); histLock=true;
    instances=d.instances; wires=d.wires; nextId=d.nextId; selected=null; histCur=s;
    render(); checkNet(); userChangeCb(); histLock=false;
  }
  function undo(){
    if(simRunning){ toast('Pare a simulação para desfazer','warn'); return; }
    if(!undoStack.length){ toast('Nada para desfazer','warn'); return; }
    redoStack.push(histCur); restoreSnap(undoStack.pop()); toast('Desfeito','ok');
  }
  function redo(){
    if(simRunning){ toast('Pare a simulação para refazer','warn'); return; }
    if(!redoStack.length){ toast('Nada para refazer','warn'); return; }
    undoStack.push(histCur); restoreSnap(redoStack.pop()); toast('Refeito','ok');
  }
  function duplicateSelected(){
    if(simRunning){ toast('Pare a simulação para duplicar','warn'); return; }
    if(!selected||selected.kind!=='inst'){ toast('Selecione um componente para duplicar','warn'); return; }
    const s0=findInst(selected.id); if(!s0) return;
    const def=getComponentDef(s0.type);
    if(def.junction){ toast('Emendas não podem ser duplicadas','warn'); return; }
    const inst={id:uid('c'),type:s0.type,x:s0.x+GRID*2,y:s0.y+GRID*2,rot:s0.rot||0,props:JSON.parse(JSON.stringify(s0.props||{}))};
    if(def.tagPrefix&&!def.tagRef){ const n=instances.filter(i=>{const d=getComponentDef(i.type);return d&&d.tagPrefix===def.tagPrefix&&!d.tagRef;}).length+1; inst.props.tag=def.tagPrefix+n; }
    instances.push(inst); renderComp(inst); select('inst',inst.id); onChangeCb(); toast('Componente duplicado','ok');
  }
  function clearWires(){
    if(simRunning){ toast('Pare a simulação para remover ligações','warn'); return; }
    wires=[]; gWires.innerHTML=''; if(selected&&selected.kind==='wire') selected=null;
    renderInspector(); onChangeCb(); checkNet(); toast('Fios removidos','warn');
  }
  function checkNet(){ if(window.NetworkSolver) window.NetworkSolver.solve(instances, wires); }

  // -------- Painel modal do inversor: display, RUN/STOP/JOG, parâmetros rápidos --------
  // Preenchido via callback registrado pelo app.js, que tem acesso à instância do InverterEngine.
  let inverterPanelHandler = null;
  function openInverterPanel(inst){
    if(inverterPanelHandler) inverterPanelHandler(inst);
  }

  let sigC={};
  function refreshAll(){ sigC={}; instances.forEach(renderComp); wires.forEach(renderWire); }
  // redesenha só o que mudou (evita recriar o SVG a cada frame e perder cliques)
  function refreshLive(){
    const NS=window.__NET_STATE__||{};
    instances.forEach(i=>{ const s=NS['sig:'+i.id]+'|'+JSON.stringify(i.props)+'|'+i.x+i.y+(i.rot||0); if(sigC['i'+i.id]!==s){ sigC['i'+i.id]=s; renderComp(i); } });
    wires.forEach(w=>{ const s=NS['wsig:'+w.id]+'|'+w.color+'|'+(selected&&selected.id===w.id); if(sigC['w'+w.id]!==s){ sigC['w'+w.id]=s; renderWire(w); } });
  }
  function migrate(d){
    const M={disjuntor:{IN1:'1',OUT1:'2',IN2:'3',OUT2:'4',IN3:'5',OUT3:'6'},'botao-na':{'1':'13','2':'14'},'botao-nf':{'1':'11','2':'12'},'chave-selectora':{'1':'13','2':'14'},'lampada-piloto':{'1':'X1','2':'X2'}};
    const ins=(d.instances||[]).map(i=>Object.assign({},i)), ws=(d.wires||[]).map(x=>JSON.parse(JSON.stringify(x))), add=[], rm={}, types={}; let nid=d.nextId||1000;
    ins.forEach(i=>{
      if(i.type==='fonte-trifasica'){ ['L1','L2','L3'].forEach((t,k)=>{ const n={id:'m'+(nid++),type:'src-'+t,x:i.x+k*40,y:i.y,rot:0,props:{}}; add.push(n); rm[i.id+'::'+t]=n.id; }); i._del=1; }
      else if(i.type==='fonte-24vcc'){ [['+','24V'],['-','0V']].forEach(([t,s],k)=>{ const n={id:'m'+(nid++),type:'src-'+s,x:i.x+k*40,y:i.y,rot:0,props:{}}; add.push(n); rm[i.id+'::'+t]=n.id; }); i._del=1; }
      else if(i.type==='contator'){ i.type='bobina-contator'; i.props={tag:'K1'}; }
      types[i.id]=i.type;
    });
    const gone=new Set();
    ins.forEach(i=>{ if(!i._del && !getComponentDef(i.type)){ i._del=1; gone.add(i.id); } });
    const out=[];
    ws.forEach(w=>{ let bad=gone.has(w.a.inst)||gone.has(w.b.inst);
      ['a','b'].forEach(s=>{ const k=w[s].inst+'::'+w[s].term;
        if(rm[k]){ w[s]={inst:rm[k],term:'T'}; }
        else { const ty=types[w[s].inst]; if(M[ty]&&M[ty][w[s].term]) w[s].term=M[ty][w[s].term]; else if(ty==='bobina-contator'&&['13','14'].includes(w[s].term)) bad=true; }});
      w.color='#000000'; if(!bad) out.push(w); });
    return {instances:[...ins.filter(i=>!i._del),...add],wires:out,nextId:nid};
  }

  function clearAll(){
    instances=[]; wires=[]; selected=null;
    gComps.innerHTML=''; gWires.innerHTML=''; gTemp.innerHTML='';
    onChangeCb(); renderInspector();
  }

  function toJSON(){ return {instances, wires, nextId}; }
  function loadJSON(data){
    data = migrate(data); instances = data.instances; wires = data.wires; nextId = data.nextId;
    render(); onChangeCb(); checkNet();
  }

  function toast(msg,kind){ window.showToast && window.showToast(msg,kind); }

  return {
    init, addInstance, clearAll, toJSON, loadJSON, deleteSelected, undo, redo, duplicateSelected, clearWires,
    get instances(){return instances;}, get wires(){return wires;},
    set onChange(fn){ userChangeCb = fn; }, set onSelect(fn){ onSelectCb=fn; },
    set onMotorParamChange(fn){ onMotorParamChange = fn; },
    set onOpenInverterPanel(fn){ inverterPanelHandler = fn; },
    setSimRunning(v){ simRunning=!!v; if(simRunning&&selected&&selected.kind==='wire') selected=null; if(!simRunning) histCur=snap(); refreshAll(); renderInspector(); },
    get simRunning(){ return simRunning; },
    toggleGrid(){ showGrid=!showGrid; document.getElementById('ce-bgrect').setAttribute('fill', showGrid?'url(#grid)':'transparent'); },
    toggleLabels(){ showLabels=!showLabels; refreshAll(); },
    resetZoom(){ scale=1; panX=0; panY=0; applyTransform(); },
    refreshAll, refreshLive, render, findInst, getComponentDef,
  };
})();
window.CircuitEditor = CircuitEditor;

</script>

<script>
// ============================================================
// IHM — interface do teclado do inversor, fiel ao manual
// (display 5 dígitos, PRG, SELETOR giratório, JOG/QUICK, RUN, STOP)
// ============================================================
const IHM = (function(){
  let state = {
    mode: 'idle',       // idle -> mostra frequência | group -> escolhendo grupo | param -> escolhendo parâmetro | value -> editando valor
    groupIdx: 0,
    paramIdx: 0,
    editValue: 0,
    digitPos: 0,        // qual dígito está piscando (tecla >>)
  };
  let onParamChange = ()=>{};
  let getInverter = ()=>null;
  let getMotor = ()=>null;

  function groupParams(groupId){
    return Object.keys(PARAMS).filter(c=>c.startsWith(groupId+'-')).sort();
  }

  function render(container){
    container.innerHTML = `
      <div style="display:flex;flex-direction:column;height:100%;overflow:hidden;">
        <div style="flex:1;overflow-y:auto;padding:18px;display:flex;gap:20px;flex-wrap:wrap;align-content:flex-start;justify-content:center;">
          ${renderIHMPanel()}
          ${renderStatusPanel()}
        </div>
      </div>`;
    wireIHMEvents();
  }

  function renderIHMPanel(){
    return `
    <div style="background:#1b2027;border:1px solid var(--line);border-radius:8px;padding:20px;width:340px;flex-shrink:0;">
      <div style="text-align:center;font-size:11px;color:var(--text-faint);letter-spacing:.08em;margin-bottom:10px;font-weight:700;">IHM · TECLADO DO INVERSOR</div>
      <div style="background:#0a0d10;border:1px solid #000;border-radius:5px;padding:16px 10px;margin-bottom:16px;position:relative;">
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-faint);font-family:var(--mono);margin-bottom:6px;">
          <span id="led-run" style="color:#333;">● RUN</span>
          <span id="led-ldc" style="color:#333;">● L/D/C</span>
        </div>
        <div id="ihm-display" style="font-family:'JetBrains Mono';font-size:30px;text-align:center;color:#ff8a1e;letter-spacing:2px;
          text-shadow:0 0 8px rgba(240,160,32,.5);">H0.00</div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-faint);font-family:var(--mono);margin-top:6px;">
          <span id="led-fr" style="color:#333;">FWD/REV</span>
          <span id="led-tc" style="color:#333;">● TC</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:14px;">
        <button class="ihm-key" data-k="PRG" style="grid-column:1;grid-row:1;">PRG</button>
        <div style="grid-column:2;grid-row:1/3;display:flex;align-items:center;justify-content:center;">
          <div id="seletor" style="width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a4350,#20262f);
            border:2px solid #454f5c;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;">
            <div style="width:4px;height:22px;background:var(--accent);border-radius:2px;position:absolute;top:6px;"></div>
          </div>
        </div>
        <button class="ihm-key" data-k="QUICK" style="grid-column:3;grid-row:1;">QUICK</button>
        <button class="ihm-key" data-k="DIGIT" style="grid-column:1;grid-row:2;font-size:15px;">≫</button>
        <button class="ihm-key" data-k="SEL" style="grid-column:3;grid-row:2;font-size:10px;">ENTER</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px;">
        <button class="ihm-key run" data-k="RUN">RUN</button>
        <div style="display:flex;gap:4px;">
          <button class="ihm-key small" data-k="UP" title="Girar seletor +">▲</button>
          <button class="ihm-key small" data-k="DOWN" title="Girar seletor -">▼</button>
        </div>
        <button class="ihm-key stop" data-k="STOP">STOP</button>
      </div>
      <div id="ihm-status-line" style="text-align:center;font-size:10.5px;color:var(--text-dim);font-family:var(--mono);margin-top:8px;min-height:16px;"></div>
    </div>`;
  }

  function renderStatusPanel(){
    return `
    <div style="width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;">
      <div style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;">
        <div style="font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.04em;margin-bottom:10px;">STATUS DO INVERSOR</div>
        <div id="inv-status-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12px;font-family:var(--mono);"></div>
      </div>
      <div style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;">
        <div style="font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.04em;margin-bottom:10px;">BUSCA RÁPIDA DE PARÂMETRO</div>
        <input type="text" id="param-search" placeholder="Ex: P0-06, P4-01, velocidade..." style="margin-bottom:8px;">
        <div id="param-search-results" style="max-height:260px;overflow-y:auto;"></div>
      </div>
      <div style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;">
        <div style="font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.04em;margin-bottom:8px;">GUIA RÁPIDO — PARTIDA VIA IHM</div>
        <div style="font-size:11.5px;color:var(--text-dim);line-height:1.7;">
          1. Ajuste <b>P4-00 a P4-06</b> conforme a plaqueta do motor.<br>
          2. Defina <b>P0-04</b> = 0 (painel) para controlar aqui.<br>
          3. Ajuste <b>P0-11</b> para a frequência desejada.<br>
          4. Pressione <b>RUN</b> para partir o motor.
        </div>
      </div>
    </div>`;
  }

  function fmtDisplay(){
    if(state.mode==='idle'){
      const inv = getInverter();
      const f = inv? inv.freqOut : 0;
      return 'H'+f.toFixed(2);
    }
    if(state.mode==='group'){
      return PARAM_GROUPS[state.groupIdx].id;
    }
    if(state.mode==='param'){
      const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
      const code = codes[state.paramIdx];
      return code ? code.replace('-',' ') : '----';
    }
    if(state.mode==='value'){
      const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
      const code = codes[state.paramIdx];
      const p = PARAMS[code];
      if(!p) return '0';
      if(p.enum){
        const e = p.enum.find(x=>x.v===state.editValue);
        return String(state.editValue);
      }
      return state.editValue.toFixed(p.decimals||0);
    }
    return '0.00';
  }

  function updateDisplay(){
    const disp = document.getElementById('ihm-display');
    if(!disp) return;
    disp.textContent = fmtDisplay();
    const statusLine = document.getElementById('ihm-status-line');
    const inv = getInverter();
    if(statusLine){
      if(state.mode==='idle'){
        statusLine.textContent = inv && inv.fault ? inv.fault.msg : (inv&&inv.runCmd? 'Em operação':'Parado');
        statusLine.style.color = inv&&inv.fault ? 'var(--red)' : 'var(--text-dim)';
      } else if(state.mode==='param'){
        const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
        const code = codes[state.paramIdx];
        const p = PARAMS[code];
        statusLine.textContent = p? p.name : '';
        statusLine.style.color='var(--text-dim)';
      } else if(state.mode==='group'){
        statusLine.textContent = PARAM_GROUPS[state.groupIdx].name;
      } else if(state.mode==='value'){
        const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
        const code = codes[state.paramIdx];
        const p = PARAMS[code];
        if(p && p.enum){
          const e = p.enum.find(x=>x.v===state.editValue);
          statusLine.textContent = e? e.l : '';
        } else if(p){
          statusLine.textContent = p.unit||'';
        }
      }
    }
    const led = {run: document.getElementById('led-run'), ldc: document.getElementById('led-ldc'),
                 fr: document.getElementById('led-fr'), tc: document.getElementById('led-tc')};
    if(led.run) led.run.style.color = inv&&inv.runCmd? '#3ecf6e' : '#333';
    if(led.ldc) led.ldc.style.color = (inv && PARAMS['P0-04'].val===1) ? '#e5484d' : '#333';
    if(led.fr) led.fr.style.color = inv&&inv.direction===-1? '#e5484d':'#333';
    if(led.tc) led.tc.style.color = inv&&inv.fault? '#e5484d':'#333';
    renderStatusGrid();
  }

  function renderStatusGrid(){
    const grid = document.getElementById('inv-status-grid');
    if(!grid) return;
    const inv = getInverter(); const motor = getMotor();
    if(!inv){ grid.innerHTML='<div style="color:var(--text-faint);grid-column:1/3;">Adicione o inversor à bancada.</div>'; return; }
    const rows = [
      ['Estado', inv.fault? 'FALHA' : (inv.runCmd? (inv.state==='ACCEL'?'ACELERANDO':inv.state==='DECEL'?'DESACEL.':'RODANDO') : 'PARADO')],
      ['Sentido', inv.direction===1?'FWD (horário)':'REV (anti-horário)'],
      ['Freq. saída', inv.freqOut.toFixed(2)+' Hz'],
      ['Freq. referência', inv.freqRef.toFixed(2)+' Hz'],
      ['Tensão CC (barramento)', inv.vdc.toFixed(0)+' V'],
      ['Tensão de saída', inv.vout.toFixed(0)+' V'],
      ['Corrente de saída', inv.iout.toFixed(2)+' A'],
      ['Potência', inv.power.toFixed(2)+' kW'],
      ['Velocidade motor', motor? motor.rpmActual.toFixed(0)+' rpm':'—'],
      ['Temp. motor (estim.)', motor? motor.tempC.toFixed(0)+' °C':'—'],
    ];
    grid.innerHTML = rows.map(r=>`<div style="color:var(--text-faint);">${r[0]}</div><div style="color:var(--text);text-align:right;">${r[1]}</div>`).join('');
    if(inv.fault){
      grid.innerHTML += `<div style="grid-column:1/3;margin-top:6px;padding:8px;background:var(--red-dim);border-radius:3px;color:#ffe0e1;font-size:11px;">${inv.fault.msg}</div>
        <button class="btn" id="reset-fault-btn" style="grid-column:1/3;margin-top:6px;">Resetar falha</button>`;
    }
    const rb = document.getElementById('reset-fault-btn');
    if(rb) rb.addEventListener('click', ()=>{ inv.clearFault(); });
  }

  function key(k){
    const inv = getInverter();
    if(k==='PRG'){
      if(state.mode==='idle'){ state.mode='group'; state.groupIdx=0; }
      else { state.mode='idle'; }
    } else if(k==='SEL'){
      if(state.mode==='group'){ state.mode='param'; state.paramIdx=0; }
      else if(state.mode==='param'){
        const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
        const code = codes[state.paramIdx];
        const p = PARAMS[code];
        if(p && !p.readonly){ state.editValue = p.val; state.mode='value'; }
        else if(p && p.readonly){ /* somente exibe */ }
      } else if(state.mode==='value'){
        const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
        const code = codes[state.paramIdx];
        const p = PARAMS[code];
        if(p && blockedWhileRunning(p)){ showToast('Parâmetro ★: altere somente com o inversor parado','warn'); state.mode='param'; updateDisplay(); return; }
        if(p){ p.val = state.editValue; onParamChange(code, p.val); }
        state.mode='param';
        showToast(`${code} gravado: ${state.editValue}`, 'ok');
      }
    } else if(k==='UP' || k==='DOWN'){
      const dir = k==='UP'?1:-1;
      if(state.mode==='group'){ state.groupIdx=(state.groupIdx+dir+PARAM_GROUPS.length)%PARAM_GROUPS.length; }
      else if(state.mode==='param'){
        const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
        state.paramIdx=(state.paramIdx+dir+codes.length)%codes.length;
      } else if(state.mode==='value'){
        const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
        const code = codes[state.paramIdx];
        const p = PARAMS[code];
        if(p){
          const step = p.step||1;
          state.editValue = Math.round((state.editValue + dir*step)*1000)/1000;
          state.editValue = Math.min(p.max??1e9, Math.max(p.min??-1e9, state.editValue));
        }
      } else if(state.mode==='idle' && inv){
        // ajusta frequência via IHM diretamente se fonte for painel
        if(PARAMS['P0-04'].val===0){
          const p = PARAMS['P0-11'];
          p.val = Math.min(p.max, Math.max(p.min, Math.round((p.val+dir*0.5)*100)/100));
          onParamChange('P0-11', p.val);
        }
      }
    } else if(k==='RUN'){
      if(inv) inv.setRunFromPanel(true, 1);
    } else if(k==='STOP'){
      if(inv){ if(inv.fault) inv.clearFault(); inv.setRunFromPanel(false); }
    } else if(k==='QUICK'){
      if(inv && PARAMS['P0-04'].val===0){
        inv.setRunFromPanel(true, 1);
        const jf = PARAMS['P7-00'].val;
        // JOG simplificado: usa freq de jog enquanto ativo (aqui: pulso único)
        showToast('JOG: pulso de teste a '+jf+' Hz', 'ok');
      }
    } else if(k==='DIGIT'){
      // cicla dígito (efeito visual apenas, muda o passo de incremento no modo valor)
      if(state.mode==='value'){
        const codes = groupParams(PARAM_GROUPS[state.groupIdx].id);
        const p = PARAMS[codes[state.paramIdx]];
        if(p && !p.enum){
          state._bigStep = !state._bigStep;
          showToast(state._bigStep? 'Incremento rápido (x10)' : 'Incremento normal', 'ok');
        }
      }
    }
    updateDisplay();
  }

  function wireIHMEvents(){
    document.querySelectorAll('.ihm-key').forEach(btn=>{
      btn.addEventListener('click', ()=> key(btn.dataset.k));
    });
    const sel = document.getElementById('seletor');
    if(sel){
      sel.addEventListener('wheel', e=>{ e.preventDefault(); key(e.deltaY<0?'UP':'DOWN'); });
      sel.addEventListener('click', ()=> key('SEL'));
    }
    const search = document.getElementById('param-search');
    if(search){
      search.addEventListener('input', ()=> renderSearchResults(search.value));
      renderSearchResults('');
    }
    updateDisplay();
  }

  function renderSearchResults(q){
    const el = document.getElementById('param-search-results');
    if(!el) return;
    q = (q||'').toLowerCase().trim();
    const codes = Object.keys(PARAMS).filter(c=>{
      const p = PARAMS[c]; if(p.hidden) return false;
      return !q || c.toLowerCase().includes(q) || p.name.toLowerCase().includes(q);
    }).slice(0,40);
    el.innerHTML = codes.map(c=>{
      const p = PARAMS[c];
      return `<div class="psr-row" data-code="${c}" style="display:flex;justify-content:space-between;gap:8px;padding:6px 4px;
        border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:11.5px;">
        <span style="color:var(--accent);font-family:var(--mono);width:56px;flex-shrink:0;">${c}</span>
        <span style="color:var(--text-dim);flex:1;">${p.name}</span>
        <span style="color:var(--text);font-family:var(--mono);">${p.enum? (p.enum.find(x=>x.v===p.val)?.l||p.val) : (p.val+(p.unit?' '+p.unit:''))}</span>
      </div>`;
    }).join('') || '<div style="color:var(--text-faint);font-size:11.5px;padding:6px;">Nenhum parâmetro encontrado.</div>';
    el.querySelectorAll('.psr-row').forEach(row=>{
      row.addEventListener('mouseenter',()=>row.style.background='var(--panel-2)');
      row.addEventListener('mouseleave',()=>row.style.background='');
      row.addEventListener('click', ()=> openParamEditor(row.dataset.code));
    });
  }

  function blockedWhileRunning(p){ const inv=getInverter&&getInverter(); return !!(p.alt==='★' && inv && (inv.runCmd||inv.freqOut>0.01)); }
  function openParamEditor(code){
    const p = PARAMS[code];
    if(!p) return;
    if(p.readonly){ showToast(code+' é somente leitura', 'warn'); return; }
    const body = document.getElementById('modal');
    let inputHtml;
    if(p.enum){
      inputHtml = `<select id="pe-input">${p.enum.map(e=>`<option value="${e.v}" ${e.v===p.val?'selected':''}>${e.v} — ${e.l}</option>`).join('')}</select>`;
    } else {
      inputHtml = `<input type="number" id="pe-input" value="${p.val}" min="${p.min??''}" max="${p.max??''}" step="${p.step||1}">`;
    }
    body.innerHTML = `
      <div class="modal-head"><h3>${code} — ${p.name}</h3><button class="modal-close" id="pe-close">×</button></div>
      <div class="modal-body">
        ${p.desc?`<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">${p.desc}</div>`:''}
        <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:10px;">Padrão de fábrica: <b style="font-family:var(--mono);color:var(--text-dim);">${p.enum? (p.enum.find(x=>x.v===p.def)?.l||p.def) : (p.def+(p.unit?' '+p.unit:''))}</b> &nbsp;·&nbsp; ${p.alt}</div>
        <label class="field"><span class="lbl">Valor ${p.unit?('('+p.unit+')'):''} ${p.min!=null?`— faixa ${p.min} a ${p.max}`:''}</span>
        ${inputHtml}</label>
      </div>
      <div class="modal-foot"><button class="btn" id="pe-cancel">Cancelar</button><button class="btn primary" id="pe-save">Gravar</button></div>`;
    document.getElementById('modal-backdrop').classList.add('open');
    const close = ()=> document.getElementById('modal-backdrop').classList.remove('open');
    document.getElementById('pe-close').addEventListener('click', close);
    document.getElementById('pe-cancel').addEventListener('click', close);
    document.getElementById('pe-save').addEventListener('click', ()=>{
      if(blockedWhileRunning(p)){ showToast('Parâmetro ★: altere somente com o inversor parado','warn'); return; }
      const raw = document.getElementById('pe-input').value;
      let v = p.enum? Number(raw) : Number(raw);
      if(!p.enum && p.min!=null) v = Math.min(p.max, Math.max(p.min, v));
      p.val = v;
      onParamChange(code, v);
      showToast(code+' atualizado para '+v, 'ok');
      close();
      renderSearchResults(document.getElementById('param-search')?.value||'');
    });
  }

  return {
    render, key, updateDisplay,
    set onChange(fn){ onParamChange = fn; },
    set inverterGetter(fn){ getInverter = fn; },
    set motorGetter(fn){ getMotor = fn; },
    openParamEditor,
  };
})();
window.IHM = IHM;

</script>

<script>
// ============================================================
// APP PRINCIPAL
// ============================================================
(function(){
  let running = false;
  let lastT = null;
  let motor = null;
  let inverter = null;
  let history = { t:[], freq:[], current:[], rpm:[], voltage:[] };
  let simTime = 0;
  const HISTORY_MAX = 300;

  function paramGetter(code){ return PARAMS[code]; }

  function initEngines(){
    inverter = new InverterEngine(paramGetter);
    const invInst = CircuitEditor.instances.find(i=>i.type==='inversor-ad600m');
    const motorInst = CircuitEditor.instances.find(i=>i.type==='motor-trifasico');
    motor = motorInst ? new MotorModel(PARAMS) : null;
  }

  function toast(msg, kind){
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast'+(kind?' '+kind:'');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); }, 2600);
  }
  window.showToast = toast;

  // ---------------- LOOP DE SIMULAÇÃO ----------------
  function tick(ts){
    if(!running) return;
    if(lastT===null) lastT=ts;
    let dt = (ts-lastT)/1000;
    dt = Math.min(dt, 0.1);
    lastT = ts;
    simTime += dt;

    const net = NetworkSolver.solve(CircuitEditor.instances, CircuitEditor.wires);
    CircuitEditor.refreshLive();
    if(inverter){
      if(net.di){ inverter.di.DI1=net.di.DI1; inverter.di.DI2=net.di.DI2; inverter.di.DI3=net.di.DI3; inverter.di.DI4=net.di.DI4; }
      inverter.ai1Volts = net.ai1Volts||0;
      const motorInst = CircuitEditor.instances.find(i=>i.type==='motor-trifasico');
      const loadPct = motorInst? motorInst.props.loadPct : 30;
      inverter.step(dt, motor, {
        powered: net.powered, inputPhaseLoss: net.inputPhaseLoss, outputShort: net.outputShort,
        lineVoltage: 220, motorLoadPct: loadPct
      });
      window.__INV_STATE_TEXT__ = (inverter.fault? 'FALHA '+inverter.fault.code : inverter.freqOut.toFixed(2)+' Hz');
      window.__INV_STATE_COLOR__ = inverter.fault? '#e5484d' : (inverter.runCmd? '#3ecf6e':'#ff8a1e');
      window.__INV_RUN_LED__ = inverter.runCmd ? '#3ecf6e' : '#2a3038';
      window.__INV_FAULT_LED__ = inverter.fault ? '#e5484d' : '#2a3038';
      window.__MOTOR_RPM__ = motor? motor.rpmActual : 0;
      window.__INV_OUT__ = inverter.fault ? 0 : inverter.freqOut;
      window.__INV_RELAY__ = !!inverter.relayOn;
      syncMonitors();

      // grava histórico
      history.t.push(simTime.toFixed(1));
      history.freq.push(inverter.freqOut);
      history.current.push(inverter.iout);
      history.rpm.push(motor? motor.rpmActual/60 : 0); // rps para caber na mesma escala aproximada
      history.voltage.push(inverter.vout);
      if(history.t.length>HISTORY_MAX){ Object.keys(history).forEach(k=>history[k].shift()); }
    }
    // atualiza visual do motor (rotação)
    const motorGEl = document.querySelector('#g-'+(CircuitEditor.instances.find(i=>i.type==='motor-trifasico')||{}).id+' #motor-rotor');
    if(motorGEl && motor){
      const rot = (simTime*motor.rpmActual*6)%360;
      motorGEl.setAttribute('transform', `rotate(${rot})`);
    }
    // atualiza inversor visual (texto de frequência) e IHM
    const invInstNow = CircuitEditor.instances.find(i=>i.type==='inversor-ad600m');
    if(invInstNow) CircuitEditor.render && refreshInverterVisual(invInstNow);
    IHM.updateDisplay();
    if(window.__IP_LIVE__) window.__IP_LIVE__();
    if(document.getElementById('view-graficos').classList.contains('active')) drawCharts();
    updateRunIndicator();

    requestAnimationFrame(tick);
  }

  function refreshInverterVisual(inst){
    const g = document.getElementById('g-'+inst.id);
    if(!g) return;
    const txt = g.querySelector('.inv-display-text');
    if(txt){ txt.textContent = window.__INV_STATE_TEXT__; txt.setAttribute('fill', window.__INV_STATE_COLOR__); }
    const runLed = g.querySelector('.inv-led-run');
    if(runLed) runLed.setAttribute('fill', window.__INV_RUN_LED__);
    const faultLed = g.querySelector('.inv-led-fault');
    if(faultLed) faultLed.setAttribute('fill', window.__INV_FAULT_LED__);
  }

  function updateRunIndicator(){
    const dot = document.getElementById('run-dot');
    const label = document.getElementById('run-label');
    if(!dot) return;
    if(!running){ dot.className='dot'; label.textContent='Simulação parada'; return; }
    if(inverter && inverter.fault){ dot.className='dot fault'; label.textContent=inverter.fault.msg; return; }
    if(inverter && inverter.runCmd){ dot.className='dot run'; label.textContent='Rodando — '+inverter.freqOut.toFixed(1)+' Hz'; return; }
    dot.className='dot'; label.textContent='Circuito energizado — parado';
  }

  function startSim(){
    if(running) return;
    initEngines();
    running=true; lastT=null;
    window.__SIM_RUNNING__ = true;
    CircuitEditor.setSimRunning(true);
    requestAnimationFrame(tick);
    toast('Simulação iniciada — edição bloqueada, componentes acionáveis','ok');
    renderQuickbar();
  }
  function stopSim(){
    running=false;
    window.__SIM_RUNNING__ = false;
    CircuitEditor.setSimRunning(false);
    if(inverter){ inverter.runCmd=false; inverter.freqOut=0; }
    window.__INV_STATE_TEXT__='0.00 Hz'; window.__INV_STATE_COLOR__='#657080';
    window.__NET_STATE__ = {}; window.__COILS__ = {}; window.__INV_OUT__ = 0;
    CircuitEditor.refreshAll();
    toast('Simulação parada — edição liberada','warn');
    renderQuickbar();
    updateRunIndicator();
  }

  // ---------------- VIEWS / TABS ----------------
  function switchView(view){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+view));
    renderQuickbar();
    if(view==='parametros'){ ensureIHMInit(); IHM.updateDisplay(); }
    if(view==='graficos'){ ensureChartsInit(); drawCharts(); }
    if(view==='biblioteca'){ ensureLibraryInit(); }
  }

  let ihmInited=false;
  function ensureIHMInit(){
    if(ihmInited) return;
    IHM.inverterGetter = ()=>inverter;
    IHM.motorGetter = ()=>motor;
    IHM.onChange = (code,val)=>{
      if(code.startsWith('P4-')||code.startsWith('M-')){ if(motor) motor.updateFromParams(PARAMS); }
      if(code==='P0-28') handleParamInit(val);
      if(code==='P4-00') handleAutoTune(val);
    };
    IHM.render(document.getElementById('view-parametros'));
    ihmInited=true;
  }

  // ---- P0-28: inicialização de parâmetros ----
  function invBusy(){ return !!(inverter && (inverter.runCmd || inverter.freqOut>0.01)); }
  function handleParamInit(v){
    const p=PARAMS['P0-28']; if(!v) return;
    if(invBusy()){ p.val=0; toast('Pare o inversor antes de inicializar parâmetros (P0-28 só pode ser alterado parado)','warn'); IHM.render(document.getElementById('view-parametros')); return; }
    if(v===1){
      let n=0;
      Object.values(PARAMS).forEach(q=>{
        if(q.readonly||q.hidden) return;
        const g=q.code.slice(0,2);
        if(g==='P4'||g==='A1'||g==='U0'||g==='U1'||q.code==='P0-20'||q.code==='P0-28') return;   // exceções do manual
        if(q.val!==q.def){ q.val=q.def; n++; }
      });
      toast('Parâmetros restaurados de fábrica ('+n+' alterados). Parâmetros do motor mantidos.','ok');
    } else if(v===2){
      Object.keys(PARAMS).filter(c=>c.startsWith('U0-')).forEach(c=>{ PARAMS[c].val=0; });
      toast('Registros de falha apagados','ok');
    } else if(v===3){
      window.__USER_BACKUP__={}; Object.values(PARAMS).forEach(q=>{ if(!q.readonly&&!q.hidden) window.__USER_BACKUP__[q.code]=q.val; });
      toast('Backup dos parâmetros do usuário gravado','ok');
    } else if(v===4){
      if(!window.__USER_BACKUP__){ toast('Não há backup de usuário gravado','warn'); }
      else { Object.keys(window.__USER_BACKUP__).forEach(c=>{ if(PARAMS[c]) PARAMS[c].val=window.__USER_BACKUP__[c]; }); toast('Backup do usuário restaurado','ok'); }
    }
    p.val=0;
    if(motor) motor.updateFromParams(PARAMS);
    IHM.render(document.getElementById('view-parametros'));
  }
  // ---- P4-00: auto-ajuste do motor (simulado) ----
  function handleAutoTune(v){
    const p=PARAMS['P4-00']; if(!v) return;
    if(invBusy()){ p.val=0; toast('Pare o inversor antes do auto-ajuste','warn'); return; }
    const vn=PARAMS['P4-02'].val, inom=PARAMS['P4-04'].val, fn=PARAMS['P4-05'].val, i0=PARAMS['P4-07'].val;
    const rs=Math.round(0.05*vn/(1.732*inom)*1000)/1000, lm=Math.round(vn/(1.732*i0*2*Math.PI*fn)*10000)/10;
    PARAMS['P4-08'].val=rs; PARAMS['P4-09'].val=Math.round(rs*0.75*1000)/1000; PARAMS['P4-10'].val=lm; PARAMS['P4-11'].val=Math.round(lm*0.06*100)/100;
    p.val=0; toast('Auto-ajuste '+(v===1?'estático':'rotativo')+' concluído (simulado)','ok');
    IHM.render(document.getElementById('view-parametros'));
  }
  // registro de falhas (U0) e monitores (U1)
  window.__onInvFault=(inv,code)=>{
    PARAMS['U0-02'].val=PARAMS['U0-01'].val; PARAMS['U0-01'].val=PARAMS['U0-00'].val; PARAMS['U0-00'].val=code;
    PARAMS['U0-03'].val=inv.freqOut; PARAMS['U0-04'].val=inv.iout; PARAMS['U0-05'].val=inv.vdc;
  };
  function syncMonitors(){
    const set=(c,v)=>{ if(PARAMS[c]) PARAMS[c].val=v; };
    set('U1-00',inverter.freqOut); set('U1-01',inverter.freqRef); set('U1-02',inverter.vdc); set('U1-03',inverter.vout);
    set('U1-04',inverter.iout); set('U1-05',inverter.power);
    let dih=0; ['DI1','DI2','DI3','DI4'].forEach((d,i)=>{ if(inverter.di[d]) dih|=(1<<i); }); set('U1-06',dih);
    set('U1-07',inverter.relayOn?1:0); set('U1-08',inverter.ai1Volts); set('U1-19',inverter.ai1Volts);
    set('U1-14',motor?Math.abs(motor.rpmActual):0); set('U1-17',inverter.freqOut); set('U1-27',inverter.freqRef);
    set('U1-23',Math.floor(inverter.tSinceEnergized/60)); set('U1-42',inverter.iout);
    set('U1-39', inverter.fault?3:((inverter.runCmd&&inverter.freqOut>0.01)?((inverter.dirEff||inverter.direction)>0?1:2):0));
    set('U1-40', inverter.fault?inverter.fault.code:0);
  }

  let chartsInited=false;
  function ensureChartsInit(){
    if(chartsInited) return;
    document.getElementById('view-graficos').innerHTML = `
      <div style="flex:1;overflow-y:auto;padding:18px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px;margin:0 auto;">
          ${['freq','current','rpm','voltage'].map(k=>chartCardHtml(k)).join('')}
        </div>
      </div>`;
    chartsInited=true;
  }
  function chartCardHtml(key){
    const titles = {freq:'Frequência de saída (Hz)', current:'Corrente de saída (A)', rpm:'Velocidade do motor (rps)', voltage:'Tensão de saída (V)'};
    const colors = {freq:'#f0a020', current:'#e5484d', rpm:'#3ecf6e', voltage:'#4d9fe5'};
    return `<div style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;">
      <div style="font-size:11.5px;font-weight:700;color:${colors[key]};letter-spacing:.03em;margin-bottom:8px;">${titles[key]}</div>
      <svg id="chart-${key}" viewBox="0 0 600 160" style="width:100%;height:160px;display:block;"></svg>
    </div>`;
  }
  function drawCharts(){
    ['freq','current','rpm','voltage'].forEach(key=>{
      const svg = document.getElementById('chart-'+key);
      if(!svg) return;
      const data = history[key];
      if(!data || data.length<2){ svg.innerHTML=''; return; }
      const max = Math.max(...data, 1)*1.15;
      const colors = {freq:'#f0a020', current:'#e5484d', rpm:'#3ecf6e', voltage:'#4d9fe5'};
      const w=600,h=160, n=data.length;
      const pts = data.map((v,i)=>`${(i/(HISTORY_MAX-1))*w},${h-10-(v/max)*(h-20)}`).join(' ');
      svg.innerHTML = `
        <line x1="0" y1="${h-10}" x2="${w}" y2="${h-10}" stroke="var(--line)" stroke-width="1"/>
        <polyline points="${pts}" fill="none" stroke="${colors[key]}" stroke-width="2"/>
        <text x="4" y="14" font-size="10" fill="var(--text-faint)" font-family="JetBrains Mono">${max.toFixed(1)}</text>
        <text x="4" y="${h-14}" font-size="10" fill="var(--text-faint)" font-family="JetBrains Mono">0</text>
        <text x="${w-4}" y="${h-2}" text-anchor="end" font-size="10" fill="var(--text-faint)" font-family="JetBrains Mono">agora — ${data[data.length-1].toFixed(2)}</text>`;
    });
  }

  // ---------------- BIBLIOTECA DE EXERCÍCIOS ----------------
  const EXERCISES = [
    {id:'ex1', title:'Partida simples via IHM', level:'Iniciante',
      goal:'Monte o circuito de força (rede→disjuntor→inversor→motor) e faça o motor girar usando apenas o teclado do inversor.',
      steps:[
        'Adicione: as alimentações L1, L2 e L3, o Disjuntor Tripolar, o Inversor AD600M e o Motor Trifásico.',
        'Ligue L1/L2/L3 da rede ao disjuntor, e do disjuntor às entradas L1/L2/L3 do inversor.',
        'Ligue U/V/W do inversor ao motor (U1/V1/W1).',
        'Feche o disjuntor (clique nele).',
        'Na aba IHM, confirme que P0-04 = 0 (Painel).',
        'Ajuste P0-11 para 30 Hz e pressione RUN.'],
      check(){ return checkPartidaSimples(); }},
  ];

  function checkPartidaSimples(){
    if(!inverter) return false;
    return inverter.runCmd && inverter.freqOut>5 && PARAMS['P0-04'].val===0;
  }
  function checkPartidaBotoeira(){
    if(!inverter) return false;
    return PARAMS['P0-04'].val===1 && (inverter.di.DI1||inverter.runCmd);
  }
  function checkPotenciometro(){
    if(!inverter) return false;
    return PARAMS['P0-06'].val===2 && inverter.ai1Volts>0.5;
  }

  // ---------------- ARQUIVO: salvar/abrir/exemplos ----------------
  function saveProject(){
    const data = { version:2, paramsVer:2, circuit: CircuitEditor.toJSON(), params: Object.fromEntries(Object.keys(PARAMS).map(c=>[c,PARAMS[c].val])) };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'inverterlab-projeto.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Projeto salvo (download iniciado)','ok');
  }
  function openProjectFile(file){
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const data = JSON.parse(e.target.result);
        loadProjectData(data);
        toast('Projeto carregado','ok');
      }catch(err){ toast('Arquivo inválido: '+err.message,'error'); }
    };
    reader.readAsText(file);
  }
  function loadProjectData(data){
    if(data.circuit) CircuitEditor.loadJSON(data.circuit);
    if(data.params && data.paramsVer===2){ Object.keys(data.params).forEach(c=>{ if(PARAMS[c]) PARAMS[c].val = data.params[c]; }); }
    else if(data.params){ toast('Projeto de versão anterior: parâmetros do inversor mantidos nos padrões do manual','warn'); }
    initEngines();
    NetworkSolver.solve(CircuitEditor.instances, CircuitEditor.wires);
  }

      name:'Partida simples via IHM',

        const disj=A('disjuntor',60,140), inv=A('inversor-ad600m',340,100), motor=A('motor-trifasico',660,60);
        wireAuto(l1,'T',disj,'1'); wireAuto(l2,'T',disj,'3'); wireAuto(l3,'T',disj,'5');
        wireAuto(disj,'2',inv,'L1'); wireAuto(disj,'4',inv,'L2'); wireAuto(disj,'6',inv,'L3');

  };

  // ---------------- PAINEL DO INVERSOR (clicável na bancada) ----------------
  const INV_PANEL_QUICK_PARAMS = ['P0-04','P0-06','P0-11','P0-14','P0-18','P0-23','P0-24','P5-00','P5-01','P5-02','P5-03'];
  function showInverterPanelModal(inst){
    const body = document.getElementById('modal');
    function calcLive(){
      const ok=!!inverter;
      return {
        f: ok ? (inverter.fault? 'FALHA '+inverter.fault.code : inverter.freqOut.toFixed(2)+' Hz') : '-- Hz',
        c: ok ? (inverter.fault? '#e5484d' : (inverter.runCmd? '#3ecf6e':'#ff8a1e')) : '#657080',
        s: !running? 'Simulação parada — inicie na aba Bancada para operar o inversor' : (ok && inverter.runCmd ? 'Em operação · sentido '+(inverter.direction===1?'FWD':'REV') : 'Parado')
      };
    }
    function live(){
      const f=document.getElementById('ip-freq'); if(!f) return;
      const v=calcLive(); f.textContent=v.f; f.style.color=v.c; f.style.textShadow='0 0 6px '+v.c+'66';
      const s=document.getElementById('ip-status'); if(s) s.textContent=v.s;
    }
    function draw(){
      const invOk = !!inverter;
      const freqTxt = invOk ? (inverter.fault? 'FALHA '+inverter.fault.code : inverter.freqOut.toFixed(2)+' Hz') : '-- Hz';
      const color = invOk ? (inverter.fault? '#e5484d' : (inverter.runCmd? '#3ecf6e':'#ff8a1e')) : '#657080';
      body.innerHTML = `
        <div class="modal-head"><h3>Painel — Inversor Altus AD600M</h3><button class="modal-close" id="ip-close">×</button></div>
        <div class="modal-body">
          <div style="background:#0a0d10;border:1px solid #000;border-radius:5px;padding:14px;margin-bottom:14px;text-align:center;">
            <div id="ip-freq" style="font-family:'JetBrains Mono';font-size:26px;color:${color};text-shadow:0 0 6px ${color}66;">${freqTxt}</div>
            <div id="ip-status" style="font-size:11px;color:var(--text-dim);margin-top:4px;font-family:var(--mono);">
              ${!running? 'Simulação parada — inicie na aba Bancada para operar o inversor' :
                (invOk && inverter.runCmd ? 'Em operação · sentido '+(inverter.direction===1?'FWD':'REV') : 'Parado')}
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:16px;">
            <button class="btn primary" id="ip-run" style="flex:1;" ${running?'':'disabled'}>▷ RUN</button>
            <button class="btn danger" id="ip-stop" style="flex:1;background:var(--red-dim);border-color:var(--red);color:var(--red);" ${running?'':'disabled'}>■ STOP</button>
            <button class="btn" id="ip-jog" style="flex:1;" ${running?'':'disabled'}>JOG</button>
          </div>
          ${invOk && inverter.fault ? `<div style="background:var(--red-dim);color:var(--red);padding:8px 10px;border-radius:3px;font-size:12px;margin-bottom:14px;">
            ${inverter.fault.msg} <button class="btn" id="ip-reset-fault" style="margin-left:8px;padding:3px 8px;">Resetar</button></div>` : ''}
          <div style="font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.03em;margin:14px 0 8px;">PARÂMETROS RÁPIDOS</div>
          <div id="ip-params"></div>
          <div style="font-size:10.5px;color:var(--text-faint);margin-top:10px;">Para todos os parâmetros (P0 a U1), use a aba <b>IHM &amp; Parâmetros</b>.</div>
        </div>
        <div class="modal-foot"><button class="btn" id="ip-done">Fechar</button></div>`;
      const paramsEl = document.getElementById('ip-params');
      paramsEl.innerHTML = INV_PANEL_QUICK_PARAMS.map(code=>{
        const p = PARAMS[code];
        const val = p.enum ? (p.enum.find(e=>e.v===p.val)?.l || p.val) : (p.val+(p.unit?' '+p.unit:''));
        return `<div class="ip-param-row" data-code="${code}" style="display:flex;justify-content:space-between;gap:8px;padding:7px 4px;

      document.getElementById('ip-done').addEventListener('click', close);
      const runBtn = document.getElementById('ip-run');
      if(runBtn) runBtn.addEventListener('click', ()=>{ if(inverter){ inverter.setRunFromPanel(true,1); draw(); } });

    }

    draw();
    document.getElementById('modal-backdrop').classList.add('open');
    window.__IP_LIVE__=live;
  }

  // ---------------- MENU / EVENTOS GLOBAIS ----------------
  function wireMenus(){
    document.querySelectorAll('.menu-item').forEach(item=>{
      const btn = item.querySelector('.menu-btn');
      const dd = item.querySelector('.dropdown');
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        document.querySelectorAll('.dropdown').forEach(d=>{ if(d!==dd) d.classList.remove('open'); });
        dd.classList.toggle('open');
      });
    });
    window.addEventListener('click', ()=> document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('open')));

    document.getElementById('dd-arquivo').addEventListener('click', e=>{
      const act = e.target.closest('button')?.dataset.act; if(!act) return;
      const editActs = ['novo','abrir'];
      if(editActs.includes(act) && running){ toast('Pare a simulação para usar essa ação','warn'); return; }
      if(act==='novo'){ if(confirm('Limpar bancada e iniciar novo projeto?')){ CircuitEditor.clearAll(); toast('Novo projeto criado','ok'); } }
      if(act==='abrir'){ document.getElementById('file-input').click(); }
      if(act==='salvar'){ saveProject(); }
      if(act==='exemplos'){ showExamplesModal(); }
      if(act==='exportar-png'){ exportSvg(); }
    });
    document.getElementById('dd-editar').addEventListener('click', e=>{
      const act = e.target.closest('button')?.dataset.act; if(!act) return;
      if(running){ toast('Pare a simulação para editar a bancada','warn'); return; }
      if(act==='desfazer') CircuitEditor.undo();
      if(act==='refazer') CircuitEditor.redo();
      if(act==='duplicar') CircuitEditor.duplicateSelected();
      if(act==='excluir') CircuitEditor.deleteSelected();
      if(act==='limpar-fios') CircuitEditor.clearWires();
      if(act==='limpar-tudo'){ if(confirm('Remover tudo da bancada?')) CircuitEditor.clearAll(); }
    });
    document.getElementById('dd-ver').addEventListener('click', e=>{
      const act = e.target.closest('button')?.dataset.act; if(!act) return;
      if(act==='grade'||act==='grid') CircuitEditor.toggleGrid();
      if(act==='rotulos') CircuitEditor.toggleLabels();
      if(act==='zoom-reset') CircuitEditor.resetZoom();
      if(act==='ajuda') showHelpModal();
      if(act==='creditos') showCreditsModal();
    });
    document.getElementById('file-input').addEventListener('change', e=>{
      if(running){ toast('Pare a simulação para abrir um arquivo','warn'); e.target.value=''; return; }
      if(e.target.files[0]) openProjectFile(e.target.files[0]);
      e.target.value='';
    });
    document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=>switchView(b.dataset.view)));
    document.getElementById('modal-backdrop').addEventListener('click', e=>{
      if(e.target.id==='modal-backdrop'){ window.__IP_LIVE__=null; e.currentTarget.classList.remove('open'); }
    });
    window.addEventListener('keydown', e=>{
      if(e.ctrlKey && e.key==='s'){ e.preventDefault(); saveProject(); }
      if(e.ctrlKey && e.key==='o'){ e.preventDefault(); if(running){ toast('Pare a simulação para abrir um arquivo','warn'); return; } document.getElementById('file-input').click(); }
      if(e.key==='F1'){ e.preventDefault(); showHelpModal(); }
    });
  }
  function exportSvg(){
    const svg = document.getElementById('ce-svg');
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const s = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([s], {type:'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='inverterlab-circuito.svg'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('SVG exportado','ok');
  }

  // ---------------- TEMA (claro padrão / escuro) ----------------
  function wireThemeToggle(){
    const btn = document.getElementById('theme-toggle');
    const label = document.getElementById('theme-label');
    btn.addEventListener('click', ()=>{
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur==='dark' ? 'light' : 'dark';
      if(next==='dark') document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.removeAttribute('data-theme');
      label.textContent = next==='dark' ? 'Escuro' : 'Claro';
      CircuitEditor.refreshAll();
    });
  }

  // ---------------- INIT ----------------
  function init(){
    wireThemeToggle();
    CircuitEditor.init(document.getElementById('view-bancada'));
    CircuitEditor.onChange = ()=>{ /* poderia auto-salvar */ };
    CircuitEditor.onSelect = ()=>{};
    CircuitEditor.onMotorParamChange = (code, val)=>{
      if(motor) motor.updateFromParams(PARAMS);
    };
    CircuitEditor.onOpenInverterPanel = (inst)=>{ showInverterPanelModal(inst); };
    wireMenus();
    NetworkSolver.solve(CircuitEditor.instances, CircuitEditor.wires);
    renderQuickbar();
    toast('Bem-vindo! Arraste componentes da paleta para montar seu circuito.','ok');
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>

r based on the Altus AD600M frequency drive.", "Projeto educacional independente e não oficial, sem vínculo com a Altus Sistemas de Automação S.A. Nomes e marcas citados pertencem aos seus respectivos titulares.": "Independent, unofficial educational project, not affiliated with Altus Sistemas de Automação S.A. Names and trademarks mentioned belong to their respective owners.", "Baseado no Altus AD600M · Educacional": "Based on the Altus AD600M · Educational", "Inversor de frequência baseado no Altus AD600M — o coração do sistema.": "Frequency drive based on the Altus AD600M — the heart of the system.", "Pratique montagens típicas de acionamento com o inversor baseado no Altus AD600M. Cada exercício verifica automaticamente se o objetivo foi atingido na bancada.": "Practice typical drive assemblies with the drive based on the Altus AD600M. Each exercise automatically checks whether the goal was achieved on the workbench.", "• InverterLab — projeto educacional não oficial, baseado no inversor Altus AD600M. Desenvolvido por Caio Bondarchuk e Breno Rossi.": "• InverterLab — unofficial educational project, based on the Altus AD600M drive. Developed by Caio Bondarchuk and Breno Rossi.", "Esses valores alimentam diretamente os parâmetros P4-01 a P4-07 do inversor e o modelo elétrico do motor (cos φ e rendimento só existem no modelo do simulador).": "These values feed drive parameters P4-01 to P4-07 and the motor electrical model directly (cos φ and efficiency exist only in the simulator model).", "Corrente a vazio": "No-load current", "Pare o inversor antes de inicializar parâmetros (P0-28 só pode ser alterado parado)": "Stop the drive before initializing parameters (P0-28 can only be changed while stopped)", "Registros de falha apagados": "Fault records cleared", "Backup dos parâmetros do usuário gravado": "User parameter backup saved", "Backup do usuário restaurado": "User backup restored", "Não há backup de usuário gravado": "No user backup saved", "Pare o inversor ant   const RULES = [
  [/^Parâmetros restaurados de fábrica \((\d+) alterados\)\. Parâmetros do motor mantidos\.$/, m=>('Factory parameters restored ('+m[1]+' changed). Motor parameters kept.')],
  [/^Auto-ajuste (estático|rotativo) concluído \(simulado\)$/, m=>('Auto-tuning ('+(m[1]==='estático'?'static':'rotating')+') completed (simulated)')],
  [/^(P\d-\d\d|[A-Z]\d-\d\d) é somente leitura$/, m=>(m[1]+' is read-only')],
  [/^(.+) adicionado$/, m=>(T(m[1])+' added')],
  [/^Exemplo carregado: (.+)$/, m=>('Example loaded: '+T(m[1]))],
  [/^Rodando — (.+)$/, m=>('Running — '+m[1])],
  [/^Carga: (.+)$/, m=>('Load: '+m[1])],
  [/^(.+) atualizado(.*)$/, m=>(m[1]+' updated'+m[2])],
  [/^Em operação · sentido (.+)$/, m=>('Running · direction '+m[1])],
  [/^FALHA (.+)$/, m=>('FAULT '+T(m[1]))],
  [/^Terminal de alimentação (.+?)\. Adicione uma fase por vez\.$/, m=>('Power supply terminal '+T(m[1])+'. Add one phase at a time.')]
  ];
  let lang='en'; try{ lang=localStorage.getItem('simlang')||'en'; }catch(e){}
  const norm=s=>String(s).replace(/\s+/g,' ').trim();
  function T(s){
    const k=norm(s);
    if(Object.prototype.hasOwnProperty.call(EN,k)) return EN[k];
    for(const [re,fn] of RULES){ const m=k.match(re); if(m) return fn(m); }
    if(k.indexOf(' — ')>0){ let ch=false; const out=k.split(' — ').map(p=>{ const t=T(p); if(t!==p) ch=true; return t; }); if(ch) return out.join(' — '); }
    return k;
  }
  const orig=new WeakMap(), origA=new WeakMap();
  function tnode(n){
    const v=n.nodeValue; if(!v||!/\S/.test(v)) return;
    const p=n.parentNode; if(p&&(p.nodeName==='SCRIPT'||p.nodeName==='STYLE')) return;
    const rec=orig.get(n);
    if(lang==='en'){
      if(rec&&v===rec.en) return;
      const k=norm(v), en=T(v);
      if(en!==k){ const out=v.match(/^\s*/)[0]+en+v.match(/\s*$/)[0]; orig.set(n,{pt:v,en:out}); n.nodeValue=out; }
    } else if(rec){ if(v===rec.en) n.nodeValue=rec.pt; orig.delete(n); }
  }
  function tattr(el,a){
    const v=el.getAttribute(a); if(!v) return;
    let m=origA.get(el); if(!m){ m={}; origA.set(el,m); }
    const rec=m[a];
    if(lang==='en'){ if(rec&&v===rec.en) return; const en=T(v); if(en!==norm(v)){ m[a]={pt:v,en:en}; el.setAttribute(a,en); } }
    else if(rec){ if(v===rec.en) el.setAttribute(a,rec.pt); delete m[a]; }
  }
  function walk(root){
    if(root.nodeType===3){ tnode(root); return; }
    if(root.nodeType!==1) return;
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=tw.nextNode())) tnode(n);
    ['title','placeholder'].forEach(a=>{ if(root.hasAttribute(a)) tattr(root,a); });
    root.querySelectorAll('[title],[placeholder]').forEach(e=>{ tattr(e,'title'); tattr(e,'placeholder'); });
  }
  const mo=new MutationObserver(ms=>{ ms.forEach(m=>{
    if(m.type==='childList') m.addedNodes.forEach(walk);
    else if(m.type==='characterData') tnode(m.target);
    else if(m.type==='attributes') tattr(m.target,m.attributeName);
  }); });
  const OPTS={childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder']};
  const _cf=window.confirm.bind(window), _al=window.alert.bind(window);
  window.confirm=m=>_cf(lang==='en'?T(m):m); window.alert=m=>_al(lang==='en'?T(m):m);
  function setLang(l){
    lang=l; try{ localStorage.setItem('simlang',l); }catch(e){}
    document.documentElement.lang = l==='en'?'en':'pt-BR';
    document.querySelectorAll('#lang-toggle .lg').forEach(s=>s.classList.toggle('on',s.dataset.l===l));
    mo.disconnect(); walk(document.body);
    if(l==='en') mo.observe(document.body,OPTS);
  }
  const btn=document.getElementById('lang-toggle');
  if(btn) btn.addEventListener('click',()=>setLang(lang==='en'?'pt':'en'));
  window.SimLang={set:setLang,get:()=>lang,T:T};
  setLang(lang);
})();
</script>
